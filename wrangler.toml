name = "portfolio-analytics"
type = "javascript"
main = "src/worker.ts"
compatibility_date = "2024-01-01"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "analytics"
database_id = "your-database-id-here"  # Will be populated after creating DB

# Environment-specific settings
[env.development]
d1_databases = [
  { binding = "ANALYTICS_DB", database_name = "analytics-dev", database_id = "your-dev-db-id" }
]

[env.production]
d1_databases = [
  { binding = "ANALYTICS_DB", database_name = "analytics", database_id = "your-prod-db-id" }
]

# Routes
routes = [
  { pattern = "https://yourportfolio.com/api/stats", zone_name = "yourportfolio.com" },
  { pattern = "https://yourportfolio.com/api/visit", zone_name = "yourportfolio.com" }
]
